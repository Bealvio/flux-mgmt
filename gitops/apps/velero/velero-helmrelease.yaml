apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: velero
      version: 11.0.0
      sourceRef:
        kind: HelmRepository
        name: velero
  # CRDs come from the chart's crds/ directory, applied by Flux. The chart's
  # own upgradeCRDs pre-upgrade Job is off: its ServiceAccount hook went
  # missing and the Job blocked every upgrade (mgmt), and where it was off the
  # CRDs were never upgraded at all (bealv: BackupRepository still required
  # resticIdentifier, so every Velero 1.17 kopia file-system backup failed).
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    upgradeCRDs: false
    snapshotsEnabled: false
    deployNodeAgent: true
    nodeAgent:
      containerSecurityContext:
        privileged: true
    configuration:
      # uploaderType: restic
      features: EnableCSI
      backupStorageLocation:
        - bucket: velero-mgmt
          name: default
          provider: aws
          prefix: fsb
          default: true
          config:
            region: minio
            s3ForcePathStyle: true
            s3Url: http://minio-mgmt.minio.svc:9000
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        volumeMounts:
          - mountPath: /target
            name: plugins
    credentials:
      useSecret: true
      existingSecret: minio-credentials
