apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: trust-manager
spec:
  stopMatchingBehavior: LeavePolicies
  syncMode: ContinuousWithDriftDetection
  reloader: true
  clusterSelector:
    matchLabels:
      type: workload
      addons.bealv.io/trust-manager: "enabled"
  kustomizationRefs:
    - kind: GitRepository
      name: infra
      namespace: flux-system
      path: ./gitops/apps/trust-manager
