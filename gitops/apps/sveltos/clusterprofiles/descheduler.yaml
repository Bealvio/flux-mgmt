# Descheduler on opt-in child clusters (mgmt installs it with its own Flux
# Kustomization). Opt a cluster in by labelling its CAPI Cluster:
#   kubectl -n capi-system label cluster <name> descheduler=true
apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: descheduler
spec:
  clusterSelector:
    matchLabels:
      descheduler: "true"
      fluxcd: "true"
  syncMode: ContinuousWithDriftDetection
  reloader: true
  policyRefs:
    - name: descheduler-clusterprofile
      namespace: projectsveltos
      kind: ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-clusterprofile
data:
  descheduler.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: descheduler
      namespace: flux-system
    spec:
      interval: 30m
      path: ./gitops/apps/descheduler
      prune: true
      sourceRef:
        kind: GitRepository
        name: mgmt
