apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: monitoring
spec:
  stopMatchingBehavior: LeavePolicies
  clusterSelector:
    matchLabels:
      monitoring: "true"
      fluxcd: "true"
  syncMode: ContinuousWithDriftDetection
  reloader: true
  policyRefs:
    - name: monitoring-clusterprofile
      namespace: projectsveltos
      kind: ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-clusterprofile
  annotations:
    projectsveltos.io/template: "true"
data:
  crds.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: monitoring-crds
      namespace: flux-system
    spec:
      deletionPolicy: Orphan
      interval: 30m
      path: ./gitops/apps/monitoring/upstream/kube-prometheus/crds
      prune: true
      sourceRef:
        kind: GitRepository
        name: mgmt
    ---
  deploy.yaml: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: monitoring
      namespace: flux-system
    spec:
      deletionPolicy: Orphan
      interval: 10m
      path: ./gitops/apps/monitoring
      prune: true
      sourceRef:
        kind: GitRepository
        name: mgmt
      dependsOn:
        - name: monitoring-crds
      patches:
        - patch: |-
            - op: remove
              path: /spec/template/spec/containers/0/args/-1
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: '--cluster-domain={{ .Cluster.metadata.name }}.local'
          target:
            kind: Deployment
            name: prometheus-operator
        - patch: |-
            apiVersion: monitoring.coreos.com/v1
            kind: Prometheus
            metadata:
              name: k8s
            spec:
              replicas: 1
              externalLabels:
                cluster: '{{ .Cluster.metadata.name }}'
              # Ship metrics to Mimir on mgmt (gitops/apps/mimir). The CA
              # comes from the trust-manager bundle already in this namespace.
              # Same drop list as mgmt (gitops/kustomizations/monitoring.yaml).
              remoteWrite:
                - url: https://mimir.bealv-mgmt.lan/api/v1/push
                  tlsConfig:
                    ca:
                      secret:
                        name: bealv-mgmt-bundle
                        key: ca.crt
                  writeRelabelConfigs:
                    - sourceLabels: [__name__]
                      regex: (etcd_request_duration_seconds|apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_list_duration_seconds|apiserver_watch_events_sizes|apiserver_response_sizes|apiserver_request_body_size_bytes)_bucket|kubernetes_feature_enabled
                      action: drop
                  queueConfig:
                    capacity: 10000
                    maxShards: 10
                    maxSamplesPerSend: 2000
          target:
            kind: Prometheus
            name: k8s
            namespace: monitoring
        - patch: |-
            apiVersion: monitoring.coreos.com/v1
            kind: Alertmanager
            metadata:
              name: main
              namespace: monitoring
            spec:
              alertmanagerConfiguration:
                name: main
              replicas: 1
              externalUrl: https://alertmanager.{{ .Cluster.metadata.name }}.lan
