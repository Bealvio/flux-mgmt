apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: external-snapshotter
spec:
  stopMatchingBehavior: LeavePolicies
  syncMode: ContinuousWithDriftDetection
  reloader: true
  clusterSelector:
    matchLabels:
      type: workload
      addons.bealv.io/external-snapshotter: "enabled"
  kustomizationRefs:
    - kind: GitRepository
      name: infra
      namespace: flux-system
      path: ./gitops/apps/external-snapshotter
