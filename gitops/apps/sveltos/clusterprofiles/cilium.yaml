apiVersion: config.projectsveltos.io/v1beta1
kind: ClusterProfile
metadata:
  name: cilium-bootstrap
  namespace: projectsveltos
spec:
  stopMatchingBehavior: LeavePolicies
  syncMode: ContinuousWithDriftDetection
  clusterSelector:
    matchLabels:
      type: workload
      addons.bealv.io/cilium: "enabled"
  policyRefs:
    - name: cilium-conf-clusterprofile
      namespace: projectsveltos
      kind: ConfigMap
  helmCharts:
    - repositoryURL: https://helm.cilium.io/
      repositoryName: cilium
      chartName: cilium/cilium
      # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
      chartVersion: 1.18.2
      releaseName: cilium
      releaseNamespace: kube-system
      helmChartAction: Install
      values: |
        k8sServiceHost: "{{ .Cluster.spec.controlPlaneEndpoint.host }}"
        k8sServicePort: "{{ .Cluster.spec.controlPlaneEndpoint.port }}"
        operator:
          replicas: 1
          updateStrategy:
            type: Recreate
            rollingUpdate: null
        l2announcements:
          enabled: true
        socketLB:
          hostNamespaceOnly: true
        kubeProxyReplacement: true
        envoy:
          enabled: false
        cni:
          exclusive: false
        ipam:
          operator:
            clusterPoolIPv4PodCIDRList:
              - {{ index .Cluster.spec.clusterNetwork.pods.cidrBlocks 0 }}
            clusterPoolIPv4MaskSize: 23
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-conf-clusterprofile
  annotations:
    projectsveltos.io/template: "true"
data:
  cilium-conf.yaml: |
    apiVersion: 'cilium.io/v2alpha1'
    kind: CiliumL2AnnouncementPolicy
    metadata:
      name: default
    spec:
      externalIPs: false
      loadBalancerIPs: true
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventSource
metadata:
  name: cilium-cluster-eventsource
spec:
  collectResources: true
  resourceSelectors:
    - group: "cluster.x-k8s.io"
      version: "v1beta1"
      kind: "Cluster"
      # Clusters opted into Cilium (add-on label catalog, AGENTS.md). Removing
      # the label drops the event and deletes the generated profile (its
      # resources stay: the trigger is LeavePolicies).
      labelFilters:
        - key: addons.bealv.io/cilium
          value: enabled
          operation: Equal
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: EventTrigger
metadata:
  name: cilium-cluster-eventtrigger
spec:
  stopMatchingBehavior: LeavePolicies
  sourceClusterSelector:
    matchLabels:
      type: mgmt
  eventSourceName: cilium-cluster-eventsource
  syncMode: ContinuousWithDriftDetection
  reloader: true
  oneForEvent: true
  policyRefs:
    - kind: ConfigMap
      name: cilium-lb-ipclaim
      namespace: projectsveltos
    - kind: ConfigMap
      name: cilium-lb-cp
      namespace: projectsveltos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-lb-ipclaim
  annotations:
    projectsveltos.io/instantiate: "true"
data:
  ipclaim.yaml: |
    apiVersion: ipam.didactiklabs.io/v1alpha1
    kind: IPClaim
    metadata:
      name: reserved-{{ .Resource.metadata.name }}-{{ .Resource.metadata.namespace }}
    spec:
      type: CIDR
      cidrPrefixLength: 25
      ipCidrRef:
        name: available-cidr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-lb-cp
  annotations:
    projectsveltos.io/instantiate: "true"
data:
  cp.yaml: |
    apiVersion: config.projectsveltos.io/v1beta1
    kind: ClusterProfile
    metadata:
      name: "lb-{{ .Resource.metadata.name }}-{{ .Resource.metadata.namespace }}"
    spec:
      stopMatchingBehavior: LeavePolicies
      reloader: true
      syncMode: ContinuousWithDriftDetection
      clusterRefs:
      - apiVersion: cluster.x-k8s.io/v1beta1
        kind: Cluster
        name: "{{ .Resource.metadata.name }}"
        namespace: "{{ .Resource.metadata.namespace }}"
      templateResourceRefs:
      - identifier: IPClaim
        resource:
          apiVersion: ipam.didactiklabs.io/v1alpha1
          kind: IPClaim
          name: "reserved-{{ .Resource.metadata.name }}-{{ .Resource.metadata.namespace }}"
      policyRefs:
      - kind: ConfigMap
        name: cilium-lbpool
        namespace: projectsveltos
        deploymentType: Remote
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-lbpool
  annotations:
    projectsveltos.io/template: "true"
data:
  cilium-lbpool.yaml: |
    apiVersion: 'cilium.io/v2'
    kind: CiliumLoadBalancerIPPool
    metadata:
      name: default
    spec:
      allowFirstLastIPs: 'No'
      blocks:
        - cidr: "{{ (getResource "IPClaim").status.claim }}"
