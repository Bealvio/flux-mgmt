apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter
spec:
  folder: administration
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  resyncPeriod: 10m
  configMapRef:
    name: grafana-dashboard-node-exporter
    key: node-exporter.json
