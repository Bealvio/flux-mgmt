apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blackbox-exporter
spec:
  folder: administration
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  resyncPeriod: 10m
  configMapRef:
    name: grafana-dashboard-blackbox-exporter
    key: blackbox-exporter.json
