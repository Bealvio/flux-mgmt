apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-overview
spec:
  folder: administration
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  resyncPeriod: 10m
  configMapRef:
    name: grafana-dashboard-cluster-overview
    key: cluster-overview.json
