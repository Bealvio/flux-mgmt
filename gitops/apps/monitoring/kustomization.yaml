resources:
  - upstream/
  - grafana-alerts/
  - grafana-dashboards/
  - servicemonitors/
  - prometheusrules/
  - probes/
  - kubestatemetrics-cm.yaml
  - kubestatemetrics-rbacs.yaml
  - grafana-folder.yaml
  - grafana-netpol.yaml
images:
  - name: ghcr.io/grafana/grafana-operator
    newTag: "v5.25.0"
patches:
  - path: prometheus-operator-patch.yaml
    target:
      kind: Deployment
      name: prometheus-operator
  - path: blackbox-exporter-patch.yaml
    target:
      kind: Deployment
      name: blackbox-exporter
  - path: node-exporter-patch.yaml
    target:
      kind: DaemonSet
      name: node-exporter
  - path: kubestatemetrics-patch.yaml
    target:
      kind: Deployment
      name: kube-state-metrics
  - path: grafana-patch.yaml
    target:
      kind: Grafana
      name: grafana
  - path: prometheus-patch.yaml
    target:
      kind: Prometheus
      name: k8s
  - path: alertmanager-patch.yaml
    target:
      kind: Alertmanager
      name: main
  - path: blackbox-exporter-cm-patch.yaml
    target:
      kind: ConfigMap
      name: blackbox-exporter-configuration
  # kube-prometheus dashboards that hid or lacked the `cluster` variable:
  # use the multi-cluster copies from grafana-dashboards/generated (-mc).
  - target:
      kind: GrafanaDashboard
      name: grafanadashboard-from-configmap-grafana-dashboard-nodes
    patch: |-
      - op: replace
        path: /spec/configMapRef/name
        value: grafana-dashboard-nodes-mc
  - target:
      kind: GrafanaDashboard
      name: grafanadashboard-from-configmap-grafana-dashboard-node-cluster-rsrc-use
    patch: |-
      - op: replace
        path: /spec/configMapRef/name
        value: grafana-dashboard-node-cluster-rsrc-use-mc
  - target:
      kind: GrafanaDashboard
      name: grafanadashboard-from-configmap-grafana-dashboard-node-rsrc-use
    patch: |-
      - op: replace
        path: /spec/configMapRef/name
        value: grafana-dashboard-node-rsrc-use-mc
  - target:
      kind: GrafanaDashboard
      name: grafanadashboard-from-configmap-grafana-dashboard-alertmanager-overview
    patch: |-
      - op: replace
        path: /spec/configMapRef/name
        value: grafana-dashboard-alertmanager-overview-mc
  - target:
      kind: GrafanaDashboard
      name: grafanadashboard-from-configmap-grafana-dashboard-grafana-overview
    patch: |-
      - op: replace
        path: /spec/configMapRef/name
        value: grafana-dashboard-grafana-overview-mc
  # Mimir (all clusters) is the default datasource where it is defined
  # (mgmt: monitoring-mgmt; bealv: Bealvio/bealv). The local Prometheus stays
  # selectable in every dashboard's `datasource` dropdown.
  - target:
      kind: GrafanaDatasource
      name: kube-prometheus
    patch: |-
      - op: replace
        path: /spec/datasource/isDefault
        value: false
  - target:
      kind: GrafanaDatasource
      name: alertmanager
    patch: |-
      - op: replace
        path: /spec/datasource/isDefault
        value: false
  # kube-prometheus PDBs dropped: Prometheus and Alertmanager run a single
  # replica (a minAvailable/maxUnavailable PDB only blocks node drains), and
  # workload clusters have 2 nodes where downtime during rollouts is accepted.
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: alertmanager-main
        namespace: monitoring
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: prometheus-k8s
        namespace: monitoring
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: prometheus-adapter
        namespace: monitoring
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: notImportantHere
      namespace: monitoring
    unsetOnly: true
    setRoleBindingSubjects: none
