apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  template:
    spec:
      volumes:
        - name: ca-cert-volume
          secret:
            secretName: bealv-mgmt-bundle
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: blackbox-exporter
          # Upstream's 40Mi limit sat at the cap and kept evicting the
          # binary's own page cache: ~40 MB/s of re-reads on the mgmt NVMe.
          resources:
            requests:
              memory: 48Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: ca-cert-volume
              mountPath: /bealv/ca.crt
              subPath: ca.crt
              readOnly: true
