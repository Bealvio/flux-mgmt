# Descheduler (https://github.com/kubernetes-sigs/descheduler): evicts pods so
# the scheduler can place them better, mainly to rebalance after a node reboot
# or drain leaves everything on the other nodes. Installed on mgmt by
# gitops/kustomizations/descheduler.yaml and on child clusters labelled
# descheduler=true by the `descheduler` Sveltos ClusterProfile.
#
# Kept conservative:
# - pods with a PVC are never evicted (RWO proxmox-csi volumes, databases);
#   neither are DaemonSet, static, mirror, bare or system-critical pods;
# - control plane namespaces are excluded: on mgmt capi-system runs the
#   Kamaji tenant control planes (bealv API server) and kamaji-system their
#   etcd, vault would come back sealed;
# - nodeFit: only evict when another node can take the pod;
# - at most 2 pods per node / 1 per namespace / 5 in total per run, every 30m.
# LowNodeUtilization works on requests (like the scheduler), not on usage.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: 0.35.1
      sourceRef:
        kind: HelmRepository
        name: descheduler
  values:
    kind: Deployment
    deschedulingInterval: 30m
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 2
      maxNoOfPodsToEvictPerNamespace: 1
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                nodeFit: true
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
                  extraEnabled:
                    - PodsWithPVC
            - name: RemoveDuplicates
              args:
                namespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
            - name: RemovePodsViolatingNodeAffinity
              args:
                namespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
              args:
                namespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
            - name: RemovePodsViolatingInterPodAntiAffinity
              args:
                namespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                namespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
            - name: LowNodeUtilization
              args:
                evictableNamespaces:
                  exclude:
                    - kube-system
                    - capi-system
                    - kamaji-system
                    - vault
                    - vault-unseal-controller-system
                # Under 20% of requests on both = underutilized (a node that
                # just came back); pods move off nodes above 60%.
                thresholds:
                  cpu: 20
                  memory: 20
                targetThresholds:
                  cpu: 60
                  memory: 60
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
