# Mimir (gitops/apps/mimir): every cluster's metrics, 15 days. Default
# datasource: dashboards open on it and the `cluster` variable picks the
# cluster. The local Prometheus (24h, mgmt only) stays in the dropdown.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir-gateway.monitoring.svc/prometheus
    isDefault: true
    jsonData:
      prometheusType: Mimir
      timeInterval: 30s
