apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-clusters
spec:
  selector:
    matchLabels:
      app: minio-clusters
  template:
    metadata:
      labels:
        app: minio-clusters
    spec:
      containers:
        - name: minio
          # minio/minio is gone from Docker Hub and quay.io ("repository does not
          # exist", 2026-10-04): community build of the MinIO source, pinned.
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          args:
            - server
            - /storage
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-clusters
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-clusters
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: storage
              mountPath: "/storage"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: minio-clusters
