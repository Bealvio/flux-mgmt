apiVersion: v1
kind: Namespace
metadata:
  name: capi-system
---
apiVersion: v1
kind: Secret
metadata:
  name: capi-vars
  namespace: capi-system
stringData:
  CLUSTER_TOPOLOGY: "true"
  EXP_CLUSTER_RESOURCE_SET: "true"
---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
  namespace: capi-system
spec:
  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
  version: v1.13.7
  configSecret:
    name: capi-vars
  # Lease renewals every 10s instead of 2s (etcd writes on the worn mgmt
  # NVMe, 2026-10-05).
  deployment:
    containers:
      - name: manager
        args:
          --leader-elect-lease-duration: 60s
          --leader-elect-renew-deadline: 40s
          --leader-elect-retry-period: 10s
