apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxClusterTemplate
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  template:
    spec:
      allowedNodes:
        - proxmox-alv
      externalManagedControlPlane: true
      dnsServers:
        - 1.1.1.1
      # The workers' network. CAPMOX (v1alpha2) builds the cluster's default
      # InClusterIPPool (<cluster>-v4-icip) from this and takes a machine's
      # InternalIP only from it ("Machine has no default IPAddresses"
      # otherwise), so it must be real: it used to be a 2.2.2.2/1.1.1.1
      # placeholder, harmless only while v1alpha1 templates set the worker
      # pool explicitly. Starts at .10: proxmox-slave-reserved (same subnet,
      # separate allocations) handed out .2-.9 to earlier workers.
      ipv4Config:
        addresses:
          - 10.250.1.10-10.250.1.250
        gateway: 10.250.0.1
        prefix: 16
        metric: 100
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
kind: KamajiControlPlaneTemplate
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  template:
    spec:
      apiServer:
        extraArgs:
          - --oidc-client-id=339899661970115028
          # - --oidc-username-claim=preferred_username
          - --oidc-groups-claim=groups
          - --oidc-issuer-url=https://zitadel.bealv.io
          # MutatingAdmissionPolicy is beta (off by default) in 1.34; Ballast's
          # enrollment policy needs it. Only valid while every cluster of this
          # class is >= 1.34 (chihiro offers v1.34.0 only). Drop both flags once
          # clusters are >= 1.36, where the API is GA as admissionregistration/v1.
          - --feature-gates=MutatingAdmissionPolicy=true
          - --runtime-config=admissionregistration.k8s.io/v1beta1=true
        # Requests so tenant control planes are not BestEffort (first evicted
        # under node memory pressure). Sized from bealv (apiserver ~1.6Gi).
        resources:
          requests:
            cpu: 250m
            memory: 1536Mi
        # Kamaji's defaults (1s timeout, 3 failures, ~30s to start) killed
        # all apiservers in a loop while etcd was slow (2026-10-02) and kept
        # killing them during their cache warm-up. Up to 5 min to start,
        # ~60s of real unresponsiveness before a restart. The provider only
        # passes probes on when apiServer, controllerManager, scheduler and
        # deployment probes are ALL set.
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      scheduler:
        extraArgs:
          - --bind-address=0.0.0.0
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      controllerManager:
        extraArgs:
          - --bind-address=0.0.0.0
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      # One replica per mgmt node: with replicas > 1 a single node failure
      # must not take a tenant API down (megumin incident, 2026-10-02).
      # matchLabelKeys scopes the spread to this cluster's pods of the same
      # rollout, so a surge rollout (maxSurge 100%) can still schedule.
      deployment:
        probes:
          startup:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          liveness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readiness:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        # Replace one pod at a time without surge: a surge rollout starts a
        # second set of apiservers (~1.85Gi each) next to the old ones, more
        # than the 10 GB mgmt nodes have free. 2 of 3 replicas keep serving.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            # A key can't be in both labelSelector and matchLabelKeys.
            labelSelector:
              matchLabels:
                kamaji.clastix.io/component: deployment
            matchLabelKeys:
              - kamaji.clastix.io/name
              - pod-template-hash
      addons:
        coreDNS: {}
        konnectivity:
          agent:
            # Detect a dead tunnel in ~80s instead of 1h (default): when the
            # tenant LB IP moves between mgmt nodes, the agents' connections
            # die silently and logs/metrics/webhooks time out until restarted.
            # >= 30s: the server rejects more frequent pings (EnforcementPolicy).
            extraArgs:
              - --keepalive-time=60s
            image: registry.k8s.io/kas-network-proxy/proxy-agent
            tolerations:
              - key: CriticalAddonsOnly
                operator: Exists
            # renovate: datasource=docker depName=registry.k8s.io/kas-network-proxy/proxy-agent
            version: v0.28.6
          server:
            image: registry.k8s.io/kas-network-proxy/proxy-server
            port: 8132
            extraArgs:
              - --keepalive-time=60s
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
            # renovate: datasource=docker depName=registry.k8s.io/kas-network-proxy/proxy-server
            version: v0.28.6
      dataStoreName: default
      kubelet:
        cgroupfs: systemd
        preferredAddressTypes:
          - InternalIP
      network:
        serviceType: LoadBalancer
      registry: registry.k8s.io
---
# v1alpha2 (CAPMOX >= v0.8): content is exactly what the v0.8 conversion
# webhook produced from the former v1alpha1 template, incl. its defaults
# (full, defaultIPv4/6, metric), so CAPI sees no change and rolls nothing.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  template:
    spec:
      checks:
        skipCloudInitStatus: true
      format: qcow2
      full: true
      network:
        networkDevices:
          - name: net0
            bridge: vmbr2
            model: virtio
            defaultIPv4: true
            defaultIPv6: true
            ipPoolRef:
              - apiGroup: ipam.cluster.x-k8s.io
                kind: InClusterIPPool
                name: proxmox-slave-reserved
      sourceNode: proxmox-alv
      templateID: 102
---
# v1beta2 (CAPI >= 1.11 storage version); content = the stored object.
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  template:
    spec:
      clusterConfiguration:
        controllerManager:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
        scheduler:
          extraArgs:
            - name: bind-address
              value: 0.0.0.0
      format: cloud-config
      joinConfiguration:
        nodeRegistration:
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            - name: node-labels
              value: topology.kubernetes.io/region=proxmox-alv,topology.kubernetes.io/zone=proxmox-alv
            - name: provider-id
              value: proxmox://'{{ ds.meta_data.instance_id }}'
---
