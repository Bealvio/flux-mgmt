# v1beta2 (v1beta1 is unserved from CAPI 1.14); content = the stored object,
# with the KubeadmConfigTemplate ref moved to v1beta2.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
      kind: KamajiControlPlaneTemplate
      name: kamaji-proxmox
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: kamaji-proxmox
  patches:
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/dnsServers
              valueFrom:
                variable: dnsServers
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxClusterTemplate
            matchResources:
              infrastructureCluster: true
      name: proxmox-cluster
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/templateID
              valueFrom:
                variable: templateID
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
      name: templateID
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/templateID
              valueFrom:
                variable: templateAltID
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker-alt
      name: templateAltID
    # Proxmox storage of the worker disks. Unset: the clone lands on the
    # template's storage; set: CAPMOX full-clones onto this one.
    - definitions:
        - jsonPatches:
            - op: add
              path: /spec/template/spec/storage
              valueFrom:
                variable: storage
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
      enabledIf: "{{ if .storage }}true{{ end }}"
      name: storage
    - definitions:
        - jsonPatches:
            - op: add
              path: /spec/template/spec/storage
              valueFrom:
                variable: storageAlt
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker-alt
      enabledIf: "{{ if .storageAlt }}true{{ end }}"
      name: storageAlt
    # Worker RAM (both classes). Overrides the reference template's 32 GB:
    # 4 x 32 GB workers during a rollout OOM-killed VMs on the Proxmox host.
    - definitions:
        - jsonPatches:
            - op: add
              path: /spec/template/spec/memoryMiB
              valueFrom:
                variable: workerMemoryMiB
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
                  - default-worker-alt
      enabledIf: "{{ if .workerMemoryMiB }}true{{ end }}"
      name: workerMemoryMiB
  variables:
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          items:
            type: string
          type: array
    - name: templateID
      required: true
      schema:
        openAPIV3Schema:
          type: integer
    - name: templateAltID
      required: false
      schema:
        openAPIV3Schema:
          type: integer
    - name: workerMemoryMiB
      required: false
      schema:
        openAPIV3Schema:
          description: RAM of every worker VM in MiB (a multiple of 8, e.g. 16384). Unset = the template's.
          type: integer
          minimum: 2048
    - name: storage
      required: false
      schema:
        openAPIV3Schema:
          description: Proxmox storage ID for default-worker disks (e.g. disk_hdd).
          type: string
    - name: storageAlt
      required: false
      schema:
        openAPIV3Schema:
          description: Proxmox storage ID for default-worker-alt disks (e.g. disk_hddb).
          type: string
  workers:
    machineDeployments:
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: kamaji-proxmox
        class: default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: kamaji-proxmox-v2
        metadata:
          labels:
            node-role.kubernetes.io/slave: ""
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: kamaji-proxmox
        class: default-worker-alt
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: kamaji-proxmox-v2
        metadata:
          labels:
            node-role.kubernetes.io/slave-hddb: ""
            node-role.kubernetes.io/gpu: ""
        # GPU group: templateAltID points at a kaassopeia "gpu" template
        # (hostpci0 = the iGPU mapping, one GVT-g vGPU). The iGPU has a single
        # vGPU slot, so the old VM must be gone before the new one can start.
        rollout:
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
