# v1beta2 (v1beta1 is unserved from CAPI 1.14); content = the stored object,
# with the KubeadmConfigTemplate ref moved to v1beta2.
apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: kamaji-proxmox
  namespace: capi-system
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1alpha2
      kind: KamajiControlPlaneTemplate
      name: kamaji-proxmox
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
      kind: ProxmoxClusterTemplate
      name: kamaji-proxmox
  patches:
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/dnsServers
              valueFrom:
                variable: dnsServers
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxClusterTemplate
            matchResources:
              infrastructureCluster: true
      name: proxmox-cluster
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/templateID
              valueFrom:
                variable: templateID
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker
      name: templateID
    - definitions:
        - jsonPatches:
            - op: replace
              path: /spec/template/spec/templateID
              valueFrom:
                variable: templateAltID
          selector:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            matchResources:
              machineDeploymentClass:
                names:
                  - default-worker-alt
      name: templateAltID
  variables:
    - name: dnsServers
      required: true
      schema:
        openAPIV3Schema:
          items:
            type: string
          type: array
    - name: templateID
      required: true
      schema:
        openAPIV3Schema:
          type: integer
    - name: templateAltID
      required: false
      schema:
        openAPIV3Schema:
          type: integer
  workers:
    machineDeployments:
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: kamaji-proxmox
        class: default-worker
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: kamaji-proxmox
        metadata:
          labels:
            node-role.kubernetes.io/slave: ""
      - bootstrap:
          templateRef:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
            kind: KubeadmConfigTemplate
            name: kamaji-proxmox
        class: default-worker-alt
        infrastructure:
          templateRef:
            apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
            kind: ProxmoxMachineTemplate
            name: kamaji-proxmox
        metadata:
          labels:
            node-role.kubernetes.io/slave-hddb: ""
