# Ballast (https://github.com/Tight-Line/ballast) right-sizes pod requests and
# limits from observed usage. Adopted from RPCU/argus (infrastructure/ballast).
#
# It reads metrics.k8s.io (served by prometheus-adapter from the monitoring
# stack, no metrics-server) into its Valkey, and once a workload has 24h of
# samples it can patch the pod's resources at admission (mode `apply`).
# Chart defaults: CPU request avg*1.25, memory request p75, memory limit
# p99*1.2, no CPU limit.
#
# Manifest/HelmRelease resources stay as they are: they are the fallback until
# a profile is ready and whenever Ballast is off. Ballast only changes the pod,
# never the Deployment/HelmRelease, so Flux doesn't fight it.
#
# Which pods, and at which mode: enrollment/enrollment-policy.yaml.
# Off switch: `kubectl -n ballast-system create configmap ballast-kill-switch`
# (pods are admitted unmodified), or suspend via BallastConfig.spec.suspended.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ballast
  namespace: ballast-system
spec:
  interval: 30m
  chart:
    spec:
      chart: ballast
      version: 0.6.2
      sourceRef:
        kind: HelmRepository
        name: ballast
  install:
    crds: CreateReplace
    # cert-manager may still be coming up on a fresh cluster.
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
  values:
    dryRun:
      measure: false
      apply: false
      # In-place resize needs Kubernetes >= 1.35 (clusters run 1.34): keep it
      # dry-run, new values only land when a pod is recreated.
      resize: true
    ballastConfig:
      # Set by the enrollment policy to <namespace>--<workload>: unique per
      # workload and stable across rollouts. The chart default
      # (app.kubernetes.io/name + component) is missing on many pods, and
      # Ballast drops a missing label from the key, so unrelated workloads
      # would share one profile. Changing this later wipes all history.
      identityLabels:
        - ballast.bealv.io/workload
  postRenderers:
    - kustomize:
        patches:
          # The chart ships failurePolicy Fail: with Ballast down, no enrolled
          # pod could be created. Ignore = admit unmodified instead.
          # IfNeeded: re-run after the enrollment MutatingAdmissionPolicy adds
          # the mode label, whatever the admission plugin order.
          - target:
              kind: MutatingWebhookConfiguration
              name: ballast
            patch: |
              - op: replace
                path: /webhooks/0/failurePolicy
                value: Ignore
              - op: add
                path: /webhooks/0/reinvocationPolicy
                value: IfNeeded
