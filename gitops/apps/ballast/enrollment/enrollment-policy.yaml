# Enroll pods in Ballast and give them a stable identity label (from
# RPCU/argus). Runs on pod CREATE only: running pods join at their next restart.
#
# Mode is `measure`: Ballast only collects usage and builds WorkloadProfiles,
# it never changes a pod. Review the profiles
# (`kubectl get workloadprofiles`), then switch the mode below to `apply` so
# pods get sized at their next restart once their profile is ready (24h).
#
# Needs the MutatingAdmissionPolicy API: beta in 1.34 and off by default, it is
# turned on for every cluster of the kamaji-proxmox ClusterClass
# (gitops/apps/cluster-api/setup/clustertemplates.yaml). Move to
# admissionregistration.k8s.io/v1 once clusters are >= 1.36.
#
# Skipped:
# - namespaces in the binding below (control plane, Flux/Sveltos, storage,
#   monitoring: sized by hand);
# - any pod with a CPU limit: Ballast never removes an existing CPU limit and
#   could set a request above it (pod rejected);
# - pods not owned by a ReplicaSet/StatefulSet/DaemonSet (Jobs never reach
#   readiness, bare pods have no stable identity);
# - CloudNativePG instances (the operator owns their resources);
# - pods that already carry a mode label (explicit opt-in/out wins).
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: ballast-enroll
spec:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: controller-owned
      expression: >-
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o,
          has(o.controller) && o.controller &&
          o.kind in ["ReplicaSet", "StatefulSet", "DaemonSet"])
    - name: not-labelled
      expression: >-
        !has(object.metadata.labels) ||
        !("ballast.tightlinesoftware.com/mode" in object.metadata.labels ||
          "cnpg.io/cluster" in object.metadata.labels)
    - name: no-cpu-limit
      expression: >-
        !object.spec.containers.exists(c, has(c.resources) &&
          has(c.resources.limits) && "cpu" in c.resources.limits)
  variables:
    - name: owner
      expression: >-
        object.metadata.ownerReferences.filter(o,
          has(o.controller) && o.controller)[0]
    - name: workload
      expression: >-
        variables.owner.kind == "ReplicaSet" && variables.owner.name.contains("-")
          ? variables.owner.name.substring(0, variables.owner.name.lastIndexOf("-"))
          : variables.owner.name
    - name: id
      expression: request.namespace + "--" + variables.workload
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {
                "ballast.tightlinesoftware.com/mode": "measure",
                "ballast.bealv.io/workload": size(variables.id) > 63
                  ? variables.id.substring(0, 62) + "x"
                  : variables.id
              }
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: ballast-enroll
spec:
  policyName: ballast-enroll
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - projectsveltos
            - ballast-system
            - monitoring
            - proxmox-csi
            - nfs-hdda
            - nfs-hddb
