apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: charts/kamaji
      version: "*"
      sourceRef:
        kind: GitRepository
        name: kamaji
        namespace: kamaji-system
  values:
    replicaCount: 1
    resources:
      limits:
        cpu: 400m
        memory: 300Mi
      requests:
        cpu: 200m
        memory: 60Mi
    image:
      repository: clastix/kamaji
      pullPolicy: Always
      tag: 26.9.5-edge
    kamaji-etcd:
      deploy: true
      fullnameOverride: kamaji-etcd
      clusterDomain: bealv-mgmt.local
      image:
        # renovate: datasource=docker depName=quay.io/coreos/etcd
        tag: v3.6.5
      datastore:
        enabled: true
        name: default
        # Keep the per-member endpoints (the etcd server cert predates the
        # -client Service; selfSigned certs are only generated at install).
        headless: true
      # Kamaji >= 26.x flips the bundled kamaji-etcd to cert-manager certs,
      # a new CA, a ServiceMonitor and a 15s liveness probe. Pin the 0.11
      # behaviour: a new CA would cut every tenant apiserver off its datastore,
      # and these values keep the etcd pod template identical (no restart).
      selfSignedCertificates:
        enabled: true
      certManager:
        enabled: false
      serviceMonitor:
        enabled: false
      livenessProbe: null
      securityContext: null
