apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-operator
  namespace: flux-system
spec:
  interval: 30m
  path: ./gitops/apps/cluster-api/upstream
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  # Lease renewals every 10s instead of 2s (etcd writes on the worn mgmt
  # NVMe, 2026-10-05). Here because buildCapi regenerates upstream/.
  patches:
    - target:
        kind: Deployment
        name: capi-operator-controller-manager
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --leader-elect-lease-duration=60s
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --leader-elect-renew-deadline=40s
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --leader-elect-retry-period=10s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-providers
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/apps/cluster-api/providers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: cluster-api-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-api-setup
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/apps/cluster-api/setup
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: cluster-api-operator
    - name: cluster-api-providers
