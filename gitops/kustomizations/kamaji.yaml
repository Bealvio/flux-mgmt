apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamaji-upstream
  namespace: flux-system
spec:
  interval: 30m
  path: ./gitops/apps/kamaji/upstream
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kamaji-setup
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/apps/kamaji/setup
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
  dependsOn:
    - name: kamaji-upstream
