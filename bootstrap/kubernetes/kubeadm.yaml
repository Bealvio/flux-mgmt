apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
networking:
  serviceSubnet: "10.96.0.0/20"
  podSubnet: "10.244.0.0/16"
  dnsDomain: "bealv-mgmt.local"
kubernetesVersion: "v1.37.1"
apiServer:
  extraArgs:
    - name: enable-admission-plugins
      value: DefaultTolerationSeconds
controllerManager:
  extraArgs:
    - name: bind-address
      value: "0.0.0.0"
scheduler:
  extraArgs:
    - name: bind-address
      value: "0.0.0.0"
controlPlaneEndpoint: "10.250.0.3:6443"
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
skipPhases:
  - addon/kube-proxy
nodeRegistration:
  kubeletExtraArgs:
    - name: node-labels
      value: topology.kubernetes.io/region=proxmox-alv,topology.kubernetes.io/zone=proxmox-alv
---
# No featureGates: SidecarContainers is GA, and kubelet >= 1.37 refuses to
# start with it ("unrecognized feature gate").
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
